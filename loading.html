<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zanora Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Window drag area */
    #window-drag-area {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 30px;
      -webkit-app-region: drag;
      z-index: 999998;
    }

    /* Window controls styling */
    #window-controls {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 999999;
      display: flex;
      background: #0a0a0a;
      padding: 10px;
      opacity: 0;
      transition: opacity 0.2s ease;
      -webkit-app-region: no-drag;
    }

    #window-controls:hover {
      opacity: 1;
    }

    .window-btn {
      width: 46px;
      height: 30px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      padding: 0;
    }

    .window-btn svg {
      width: 16px;
      height: 16px;
    }

    .window-btn:hover {
      background: #1a1a1a;
    }

    .window-btn.close:hover {
      background: #e81123;
    }

    .logo-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 20px;
    }

    .logo {
      width: 120px;
      height: 120px;
      animation: logoFadeIn 1s ease-in-out;
    }

    .zanora-text {
      font-size: 48px;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: 8px;
      opacity: 0;
      animation: textFadeIn 1.2s ease-in-out 0.3s forwards;
    }

    @keyframes logoFadeIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes textFadeIn {
      0% {
        opacity: 0;
        transform: translateX(-30px);
        filter: blur(10px);
      }
      50% {
        filter: blur(2px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
        filter: blur(0);
      }
    }
  </style>
</head>
<body>
  <div id="window-drag-area"></div>
  <div id="window-controls">
    <button class="window-btn minimize">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50px" height="50px">
        <path fill="#cccccc" d="M41,4H9C6.24,4,4,6.24,4,9v32c0,2.76,2.24,5,5,5h32c2.76,0,5-2.24,5-5V9C46,6.24,43.76,4,41,4z M37,36c0,0.55-0.45,1-1,1H14 c-0.55,0-1-0.45-1-1v-2c0-0.55,0.45-1,1-1h22c0.55,0,1,0.45,1,1V36z"/>
      </svg>
    </button>
    <button class="window-btn maximize">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px">
        <path fill="#cccccc" d="M36.5,42h-25C8.467,42,6,39.532,6,36.5v-25C6,8.468,8.467,6,11.5,6h25c3.033,0,5.5,2.468,5.5,5.5v25	C42,39.532,39.533,42,36.5,42z"/>
      </svg>
    </button>
    <button class="window-btn close">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50px" height="50px">
        <path fill="#cccccc" d="M41,4H9C6.24,4,4,6.24,4,9v32c0,2.76,2.24,5,5,5h32c2.76,0,5-2.24,5-5V9C46,6.24,43.76,4,41,4z M34.71,33.29l-1.42,1.42 L25,26.42l-8.29,8.29l-1.42-1.42L23.58,25l-8.29-8.29l1.42-1.42L25,23.58l8.29-8.29l1.42,1.42L26.42,25L34.71,33.29z"/>
      </svg>
    </button>
  </div>

  <div class="logo-container">
    <img src="zanora-logo-app.png" alt="Zanora Logo" class="logo">
    <div class="zanora-text">zanora</div>
  </div>

  <script>
    // Add event listeners for window controls
    document.querySelector('.minimize').addEventListener('click', () => {
      window.electronAPI.minimize();
    });

    document.querySelector('.maximize').addEventListener('click', () => {
      window.electronAPI.maximize();
    });

    document.querySelector('.close').addEventListener('click', () => {
      window.electronAPI.close();
    });

    // Wait for animation to complete, then notify main process
    setTimeout(() => {
      window.electronAPI.loadingComplete();
    }, 1800);
  </script>
</body>
</html>
